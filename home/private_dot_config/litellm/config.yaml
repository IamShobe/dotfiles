# LiteLLM gateway in front of Claude Code — one `claude`, routed by model name.
#
#   claude-*      → api.anthropic.com  Claude Code's own subscription OAuth is forwarded untouched
#                                      (official LiteLLM "Claude Code Max" flow).
#   anything else → whatever models.local.yaml defines (machine-local, NOT in dotfiles).
#
# Started lazily by the `claude` wrapper in ~/.zshrc.d/claude-litellm.zsh on 127.0.0.1:4000.

# Machine-local models (e.g. an employer's gateway). Same dir as this file; the wrapper seeds
# an empty one if missing. Entries are appended to model_list below.
include:
  - models.local.yaml

model_list:
  # Anthropic passthrough: any claude-* id Claude Code asks for, as-is.
  - model_name: "anthropic/*"
    litellm_params:
      model: "anthropic/*"

general_settings:
  # Proxy auth rides in `x-litellm-api-key` so the `Authorization` header stays free to
  # carry Claude Code's OAuth token through to Anthropic. Localhost-only; not a secret.
  master_key: sk-litellm-local
  forward_client_headers_to_llm_api: true

# Let Claude Code own retries: it backs off on 429s honoring retry-after. LiteLLM's default
# (2 silent retries) just delays that and hides the rate limit from the client.
router_settings:
  num_retries: 0

litellm_settings:
  drop_params: true
  # Azure providers in models.local.yaml may rely on this: DefaultAzureCredential → `az login`.
  enable_azure_ad_token_refresh: true
